<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />
        <link rel="preconnect" href="https://fonts.bunny.net" />
        <link
            href="https://fonts.bunny.net/css?family=inria-sans"
            rel="stylesheet"
        />
        <link
            href="https://fonts.bunny.net/css?family=blinker"
            rel="stylesheet"
        />
        <title>lil internet thingy</title>
        <style>
            *,
            *::before,
            *::after {
                all: unset;
                font-family: "Inria Sans", sans-serif;
                color: white;
                background-color: oklch(0.142 0.0285 234.3);
                box-sizing: border-box;
                display: flex;
                border-width: 0;
                border-style: solid;
                cursor: default;

                > &::selection {
                    background-color: transparent;
                    text-decoration: underline darkcyan;
                }
            }

            :root,
            body {
                min-height: 100dvh;
            }

            head {
                display: none;
            }

            body {
                display: flex;
                padding: 2.5rem;
                flex: 1;
                max-width: 1200px;
                margin: 0 auto;
                gap: 2rem;

                & > * {
                    flex: 1;
                }
            }

            @media (max-width: 768px) {
                body {
                    flex-direction: column;
                }

                main,
                aside {
                    flex: none;
                }
            }

            h1,
            h2 {
                font-family: "Blinker", sans-serif;
                font-weight: 600;
            }

            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 1.75rem;
                margin: 0 0 0.5rem;
            }

            * + h2 {
                margin-top: 0.5rem;
            }

            a,
            button {
                cursor: pointer;
            }

            a {
                display: inline;
                color: darkcyan;

                &:hover {
                    text-decoration: underline;
                }
            }

            button {
                cursor: pointer;
                padding: 0.5rem;
                border: 2px solid white;

                &:hover {
                    background: white;
                    color: black;
                }
            }

            ul {
                display: block;
                list-style: none;
            }

            li {
                display: list-item;
            }

            main,
            aside {
                display: flex;
                flex-direction: column;
            }
        </style>
    </head>
    <body>
        <aside>
            <h1>coolbocia's space</h1>
            <p>Hi there!</p>
            <h2>links</h2>
            <ul>
                <li><a href="https://github.com/coolbocia">github</a></li>
                <li>
                    <a href="https://tangled.org/coolbocia.dev">tangled</a>
                </li>
                <li>
                    <a
                        href="https://witchsky.app/profile/did:plc:fqps6m2okxeqpy7aioqky3am"
                        >bluesky</a
                    >
                </li>
            </ul>
        </aside>
        <main>
            <h2>projects</h2>
            <p>coming soon</p>
        </main>
    </body>
</html>
